name: Sync CV from Overleaf

on:
  schedule:
    # Every 2 hours (GitHub cron is best-effort; expect some minutes of drift)
    - cron: '23 */2 * * *'
  workflow_dispatch:        # lets you trigger an immediate rebuild from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-cv
  cancel-in-progress: false

env:
  OVERLEAF_PROJECT_ID: 6a510f2b49adad6c1fbeeb2a

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Clone the Overleaf project
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://git:${OVERLEAF_TOKEN}@git.overleaf.com/${OVERLEAF_PROJECT_ID}" overleaf
          echo "OVERLEAF_SHA=$(git -C overleaf rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Skip if Overleaf has not changed
        id: changed
        run: |
          previous="$(cat .overleaf-sha 2>/dev/null || echo none)"
          if [ "$previous" = "$OVERLEAF_SHA" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No new Overleaf commits ($previous). Nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Overleaf moved: $previous -> $OVERLEAF_SHA"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile the CV
        if: steps.changed.outputs.run == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: overleaf
          root_file: main.tex
          latexmk_use_lualatex: false

      - name: Commit the new PDF
        if: steps.changed.outputs.run == 'true'
        run: |
          cp overleaf/main.pdf cv.pdf
          echo "$OVERLEAF_SHA" > .overleaf-sha
          if git diff --quiet -- cv.pdf .overleaf-sha; then
            echo "Rebuilt PDF is byte-identical; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf .overleaf-sha
          git commit -m "Update CV from Overleaf (${OVERLEAF_SHA:0:7})"
          git push
